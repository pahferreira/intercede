name: intercede

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: intercede
      POSTGRES_PASSWORD: intercede
      POSTGRES_DB: intercede
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intercede -d intercede"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
